<head>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --micro: #22c55e;
      --micro-bg: rgba(34, 197, 94, 0.12);
      --blue: #3b82f6;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 30px 20px;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .badge-hip {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 14px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter-btn {
      padding: 8px 18px;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
    }

    .card.is-micro {
      border-left: 4px solid var(--micro);
    }

    .card-img-container {
      width: 100%;
      height: 220px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid var(--card-border);
      overflow: hidden;
      padding: 10px;
    }

    .card-img {
      max-height: 95%;
      max-width: 95%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .card-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      z-index: 2;
    }

    .micro-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--micro-bg);
      border: 1px solid var(--micro);
      color: var(--micro);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 2;
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card-muscles {
      color: #a5b4fc;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .card-cues {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid #38bdf8;
      flex-grow: 1;
    }

    .card-why {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .btn-video {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.2s;
      text-align: center;
    }

    .btn-video:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function renderCards(list) {
      const grid = document.getElementById("exerciseGrid");
      grid.innerHTML = "";
      list.forEach(ex => {
        const filename = ex.img.split('/').pop();
        const localSrc = `./images/${filename}`;
        const fallbackSrc = ex.img;
        const card = document.createElement("div");
        card.className = `card ${ex.isMicro ? 'is-micro' : ''}`;
        card.innerHTML = `
          <div class="card-img-container">
            <span class="card-tag">${ex.cat}</span>
            ${ex.isMicro ? '<span class="micro-pill">★ Micro-Link</span>' : ''}
            <img class="card-img" src="${localSrc}" onerror="this.onerror=null; this.src='${fallbackSrc}';" alt="${ex.name}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-title">${ex.name}</div>
            <div class="card-muscles">Target: ${ex.muscles}</div>
            <div class="card-cues"><strong>Setup & Form:</strong> ${ex.cues}</div>
            <div class="card-why"><strong>Why:</strong> ${ex.why}</div>
            <a class="btn-video" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.query)}" target="_blank">
              ▶ Watch Video Tutorial
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll(".filter-bar .filter-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      if (cat === 'all') {
        renderCards(exercises);
      } else if (cat === 'micro') {
        renderCards(exercises.filter(e => e.isMicro));
      } else {
        renderCards(exercises.filter(e => e.cat === cat || (e.routineDay && e.routineDay === cat)));
      }
    }

    renderCards(exercises);
  </script>
